<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InputLab</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f6;--cd:#fff;--c2:#ececf0;--tx:#111214;--mu:#6b6f76;--ac:#3e91ff;--acs:#e3efff;--ok:#1f9d55;--oks:#dcf5e6;--wn:#b36b00;--wns:#fff0d1;--bad:#d93636;--bads:#fde3e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cd:#1d1d1f;--c2:#2c2c2f;--tx:#f2f2f4;--mu:#9a9ca3;--ac:#4d9bff;--acs:#12263f;--ok:#4cd07d;--oks:#10301d;--wn:#ffbf47;--wns:#33280a;--bad:#ff6b6b;--bads:#3a1717}}
:root[data-theme="dark"]{--bg:#000;--cd:#1d1d1f;--c2:#2c2c2f;--tx:#f2f2f4;--mu:#9a9ca3;--ac:#4d9bff;--acs:#12263f;--ok:#4cd07d;--oks:#10301d;--wn:#ffbf47;--wns:#33280a;--bad:#ff6b6b;--bads:#3a1717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Figtree,system-ui,"Segoe UI","Noto Sans",sans-serif;min-height:100vh}
.w{max-width:1060px;margin:0 auto;padding:14px 16px 56px}
.bar{display:flex;justify-content:flex-end;gap:8px}
select,.ib{height:42px;border:0;border-radius:999px;background:var(--cd);color:var(--tx);font:600 14px inherit;font-family:inherit;padding:0 14px;cursor:pointer}
.ib{width:42px;padding:0;font-size:18px}
h1{font-size:clamp(34px,7vw,46px);font-weight:800;letter-spacing:-.03em;margin:44px 0 22px;line-height:1.05}
h2{font-size:18px;font-weight:700;margin:0 0 4px}
nav{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}
nav button{border:0;background:var(--cd);color:var(--mu);font:600 15px inherit;font-family:inherit;padding:11px 22px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--ac);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,#pad:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--cd);border-radius:28px;padding:20px}
.hint{color:var(--mu);margin:0 0 14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.row .card{border-radius:24px;padding:16px 18px}
.st b{display:block;font-size:28px;font-weight:800;line-height:1.15;word-break:break-word}
.st span{color:var(--mu);font-size:13px}
.grp{margin-bottom:12px}.grp>span{display:block;color:var(--mu);font-size:13px;font-weight:600;margin:0 0 6px 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip,.btn{border:0;background:var(--c2);color:var(--tx);font:600 14px inherit;font-family:inherit;padding:9px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:#fff}
.btn.p{background:var(--ac);color:#fff}
#kbw{overflow-x:auto;direction:ltr;margin:6px 0 10px;border-radius:20px;background:var(--c2)}
#kb{position:relative}
.key{position:absolute;background:var(--cd);color:var(--mu);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,calc(var(--u)*.27),14px);font-weight:600;user-select:none;box-shadow:0 2px 0 #0002;transition:background .08s}
.key.ok{background:var(--oks);color:var(--ok)}
.key.dn{background:var(--ac);color:#fff;transform:translateY(2px);box-shadow:none}
.key.bd{background:var(--bads);color:var(--bad)}
.key.op{outline:1.5px dashed var(--bd,#8886);outline-offset:-3px}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:6px;vertical-align:-1px}
.lk{display:flex;gap:6px;margin-bottom:12px}
.lk span,.mb span{background:var(--c2);color:var(--mu);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.lk span.on,.mb span.on{background:var(--oks);color:var(--ok)}
.sp{height:14px}
#tx{font-size:18px;line-height:1.7;margin:8px 0 12px;max-width:64ch;direction:ltr;text-align:start}
#tx .g{color:var(--ok)}#tx .r{color:var(--bad);background:var(--bads)}#tx .cur{background:var(--acs);border-bottom:2px solid var(--ac)}
#ti{width:100%;font:16px inherit;font-family:inherit;padding:13px 16px;border:0;border-radius:18px;background:var(--c2);color:var(--tx);direction:ltr}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr}}
#pad{height:240px;border-radius:28px;background:var(--cd);border:2px dashed var(--c2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:crosshair;user-select:none;touch-action:none;padding:12px}
#pad:hover{border-color:var(--ac)}
.mb{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;justify-content:center}
#cps{width:100%;height:130px;border-radius:24px;border:0;background:var(--acs);color:var(--ac);font:800 24px inherit;font-family:inherit;cursor:pointer;user-select:none}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.sc1{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--v)*1%),var(--c2) 0);display:grid;place-items:center;margin-bottom:6px}
.ring i{width:82px;height:82px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font:800 30px inherit;font-style:normal;font-family:inherit}
.sc1 span{color:var(--mu)}
.sum{background:var(--acs);border-radius:24px;padding:16px 20px;margin-bottom:14px}.sum ul{margin:6px 0 0;padding-inline-start:20px}
.it{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--c2)}
.it:first-of-type{border-top:0}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.ic.ok{background:var(--oks);color:var(--ok)}.ic.warn{background:var(--wns);color:var(--wn)}.ic.bad{background:var(--bads);color:var(--bad)}.ic.na{background:var(--c2);color:var(--mu)}
.it b{display:block}.it span{color:var(--mu);font-size:14px;word-break:break-word}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--c2);font-size:14px}.kv span{color:var(--mu)}.kv b{text-align:end}
small.n{display:block;color:var(--mu);margin-top:14px;font-size:13px;max-width:80ch}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="w">
<div class="bar"><select id="lg" aria-label="Language"></select><button class="ib" id="thb" aria-label="Theme">◐</button></div>
<h1>InputLab</h1>
<nav role="tablist">
 <button role="tab" aria-selected="true" data-t="kb" data-i="0"></button>
 <button role="tab" aria-selected="false" data-t="ms" data-i="1"></button>
 <button role="tab" aria-selected="false" data-t="rp" data-i="2"></button>
</nav>

<section id="p-kb">
 <div class="card" style="margin-bottom:14px">
  <p class="hint" data-i="3"></p>
  <div class="grp"><span data-i="9"></span><div class="chips" id="cz"></div></div>
  <div class="row" style="margin-bottom:10px">
   <div class="card st"><b id="k1">0 / 0</b><span data-i="5"></span></div>
   <div class="card st"><b id="k2">0</b><span data-i="6"></span></div>
   <div class="card st"><b id="k3">0</b><span data-i="7"></span></div>
   <div class="card st"><b id="k4">—</b><span data-i="8"></span></div>
  </div>
  <div class="lk"><span id="lkCapsLock">Caps</span><span id="lkNumLock">Num</span><span id="lkScrollLock">Scroll</span></div>
  <div id="kbw"><div id="kb"></div></div>
  <div class="lg"><span><i style="background:var(--oks)"></i>OK</span><span><i style="background:var(--ac)"></i>↓</span><span><i style="background:var(--bads)"></i>×2</span><span><i style="outline:1.5px dashed #8886;outline-offset:-2px"></i>Win / Fn / Prt…</span></div>
  <div class="sp"></div><button class="btn" id="kR" data-i="15"></button>
 </div>
 <div class="card">
  <h2 data-i="16"></h2>
  <div id="tx"></div>
  <input id="ti" type="text" autocomplete="off" spellcheck="false" aria-label="Typing">
  <div class="row" style="margin:14px 0 0"><div class="st"><b id="wpm">—</b><span data-i="17"></span></div><div class="st"><b id="acc">—</b><span data-i="18"></span></div><div><button class="btn" id="tR" data-i="19"></button></div></div>
 </div>
</section>

<section id="p-ms" hidden>
 <div class="card" style="margin-bottom:14px">
  <p class="hint" data-i="4"></p>
  <div class="grp"><span data-i="10"></span><div class="chips" id="cc"></div></div>
  <div class="grp" style="margin-bottom:0"><span data-i="11"></span><div class="chips" id="cb"></div></div>
 </div>
 <div class="row">
  <div class="card st"><b id="m1">—</b><span data-i="21"></span></div>
  <div class="card st"><b id="m2">0</b><span data-i="22"></span></div>
  <div class="card st"><b id="m3">0 / 0</b><span data-i="23"></span></div>
  <div class="card st"><b id="m4">—</b><span data-i="24"></span></div>
 </div>
 <div class="two">
  <div><div id="pad" tabindex="0"><h2 data-i="25"></h2><p class="hint" style="margin:6px 0 0">L · M · R · ◀ · ▶ · ↑↓</p></div><div class="mb" id="mb"></div></div>
  <div class="card"><h2 data-i="26"></h2><p class="hint" data-i="27"></p><button id="cps"></button></div>
 </div>
 <div class="sp"></div><button class="btn" id="mR" data-i="15"></button>
</section>

<section id="p-rp" hidden>
 <div class="sc" id="sc"></div>
 <div class="sum" id="sum"></div>
 <div class="two"><div class="card"><h2 data-i="0"></h2><div id="rk"></div></div><div class="card"><h2 data-i="1"></h2><div id="rm"></div></div></div>
 <div class="card" style="margin-top:14px"><h2 data-i="35"></h2><div id="inf"></div></div>
 <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn p" id="cp" data-i="33"></button><span id="cpm" class="hint" style="margin:0"></span></div>
 <small class="n" data-i="36"></small>
</section>
</div>

 if(!e.repeat){if(k.last[c]!==undefined&&n-k.last[c]<35)k.ch[c]=(k.ch[c]||0)+1;k.last[c]=n;k.ds[c]=n}
 else if(k.lr[c]&&n-k.lr[c]<250)k.rp.push(n-k.lr[c]);
 k.lr[c]=n;k.p.add(c);k.dn.add(c);k.max=Math.max(k.max,k.dn.size);
 $("#k4").textContent=LAB[c]||c;lks(e);kbU();
});

 if(k.ds[c]!==undefined){const d=performance.now()-k.ds[c];if(d<600)k.dw.push(d);delete k.ds[c]}

/* mouse */
const BL={0:"L",1:"M",2:"R",3:"◀",4:"▶"},EXP={2:[0,2],3:[0,1,2],4:[0,1,2,3],5:[0,1,2,3,4],6:[0,1,2,3,4],7:[0,1,2,3,4]};
function rMp(){
 const ex=EXP[PF.btns],xt=PF.btns>=7?[5,6]:PF.btns>=6?[5]:[];
 $("#mb").innerHTML=[...ex,...xt].map(b=>`<span data-b="${b}" class="${M.lit.has(""+b)?"on":""}">${BL[b]||b}${xt.includes(b)?"*":""}</span>`).join("")+[["u","↑"],["d","↓"],["x","2×"]].map(([k,l])=>`<span data-b="${k}" class="${M.lit.has(k)?"on":""}">${l}</span>`).join("");
}
const lit=k=>{k=""+k;M.lit.add(k);const e=$(`#mb [data-b="${k}"]`);if(e)e.classList.add("on")};
const pad=$("#pad");
pad.addEventListener("mousedown",e=>{
 e.preventDefault();pad.focus();const b=e.button,n=performance.now();
 if(M.ld[b]!==undefined&&n-M.ld[b]<40)M.ch++;
 M.ld[b]=n;M.ds[b]=n;M.b[b]=(M.b[b]||0)+1;lit(b);$("#m2").textContent=M.ch;
});
pad.addEventListener("mouseup",e=>{e.preventDefault();const s=M.ds[e.button];if(s!==undefined){const d=performance.now()-s;if(d<800)M.dw.push(d);delete M.ds[e.button]}});
pad.addEventListener("auxclick",e=>e.preventDefault());
pad.addEventListener("contextmenu",e=>e.preventDefault());
pad.addEventListener("dblclick",()=>lit("x"));
pad.addEventListener("wheel",e=>{e.preventDefault();if(e.deltaY<0){M.up++;lit("u")}else if(e.deltaY>0){M.dn++;lit("d")}M.dl=Math.round(Math.abs(e.deltaY));$("#m3").textContent=M.up+" / "+M.dn},{passive:false});
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};
pad.addEventListener("pointermove",e=>{
 const l=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 for(const x of(l.length?l:[e]))M.ts.push(x.timeStamp);
 if(M.ts.length>600)M.ts.splice(0,M.ts.length-600);
 if(M.lt!=null){const dt=e.timeStamp-M.lt,v=Math.hypot(e.movementX,e.movementY)/dt*1000;if(dt>0&&dt<100&&isFinite(v)&&v<60000)M.sp=Math.max(M.sp,v)}
 M.lt=e.timeStamp;
 const d=[];for(let i=1;i<M.ts.length;i++){const v=M.ts[i]-M.ts[i-1];if(v>.2&&v<40)d.push(v)}
 if(d.length>=30){const mn=d.reduce((a,b)=>a+b,0)/d.length;M.j=Math.round(Math.sqrt(d.reduce((a,b)=>a+(b-mn)**2,0)/d.length)/mn*100);M.hz=Math.min(1000,Math.round(1000/med(d)));$("#m1").textContent=M.hz}
});
let cn=0,cs=null,ct=null,lastC=null;const cb=$("#cps");
const setCps=()=>{if(cs===null)cb.textContent=lastC||tr(28)};
cb.addEventListener("mousedown",()=>{
 if(cs===null){cn=0;cs=performance.now();ct=setInterval(()=>{const r=5-(performance.now()-cs)/1000;
  if(r<=0){clearInterval(ct);const v=cn/5;M.cps=Math.max(M.cps||0,v);lastC=v.toFixed(1)+"/s  ↻";$("#m4").textContent=M.cps.toFixed(1);cs=null;setCps()}
  else cb.textContent=r.toFixed(1)+" s · "+cn},100)}
 if(cs!==null)cn++;
});
$("#mR").onclick=()=>{M=newMs();lastC=null;["m1","m4"].forEach(i=>$("#"+i).textContent="—");$("#m2").textContent=0;$("#m3").textContent="0 / 0";rMp();setCps()};

/* device info */
let hzD=null;(()=>{let n=0,t=null;const f=now=>{if(t===null)t=now;n++;if(now-t<1000)requestAnimationFrame(f);else hzD=Math.round(n*1000/(now-t))};requestAnimationFrame(f)})();
let lay="?";try{navigator.keyboard.getLayoutMap().then(m=>{const q=m.get("KeyQ"),y=m.get("KeyY");lay=q==="a"?"AZERTY":y==="z"?"QWERTZ":q==="q"?"QWERTY":(q||"?").toUpperCase()}).catch(()=>{})}catch(e){}
function info(){
 const ua=navigator.userAgent,br=/Edg\//.test(ua)?"Edge":/OPR\//.test(ua)?"Opera":/Firefox\//.test(ua)?"Firefox":/Chrome\//.test(ua)?"Chrome":/Safari\//.test(ua)?"Safari":"?";
 return[["OS",(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||"?"],["Browser",br],["Screen",screen.width+"×"+screen.height+" @"+(window.devicePixelRatio||1)+"x"],["Display",hzD?hzD+" Hz":"…"],["CPU",navigator.hardwareConcurrency||"?"],["Layout",lay],["Touch",navigator.maxTouchPoints||0],["Lang",navigator.language||"?"]];
}

/* report */
const PT={ok:1,warn:.5,bad:0},IC={ok:"✓",warn:"!",bad:"✕",na:"–"};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function build(){
 const k=KB,K=[],Q=[],rq=reqCodes(),got=rq.filter(c=>k.p.has(c)),ms_=rq.filter(c=>!k.p.has(c)).map(c=>LAB[c]||c);
 K.push({s:!got.length?"na":!ms_.length?"ok":got.length/rq.length>.6?"warn":"bad",n:41,d:got.length+" / "+rq.length+(ms_.length&&got.length?" · "+tr(55)+": "+ms_.join(", "):"")});
 const dk=Object.keys(k.ch);
 K.push({s:!got.length?"na":dk.length?"bad":"ok",n:42,d:dk.length?dk.map(c=>(LAB[c]||c)+" ×"+k.ch[c]).join(", "):"0"});
 K.push({s:k.max<2?"na":k.max>=4?"ok":"warn",n:43,d:String(k.max)});
 if(k.dw.length){const a=avg(k.dw);K.push({s:a<25||a>350?"warn":"ok",n:44,d:Math.round(a)+" ms"})}else K.push({s:"na",n:44,d:"—"});
 K.push(k.rp.length>4?{s:"ok",n:45,d:Math.round(1000/med(k.rp))+" /s"}:{s:"na",n:45,d:"—"});
 K.push({s:TY.wpm==null?"na":TY.wpm>=30&&TY.acc>=90?"ok":"warn",n:16,d:TY.wpm==null?"—":TY.wpm+" · "+TY.acc+"%"});
 const ex=EXP[PF.btns],any=Object.values(M.b).some(v=>v),core=ex.filter(b=>b<3),side=ex.filter(b=>b>=3),mc=core.filter(b=>!M.b[b]).map(b=>BL[b]),sm=side.filter(b=>!M.b[b]).map(b=>BL[b]);
 Q.push({s:!any?"na":!mc.length?"ok":"warn",n:46,d:mc.length?tr(55)+": "+mc.join(", "):core.map(b=>BL[b]).join(" ")+" ✓"});
 if(side.length)Q.push({s:!any?"na":!sm.length?"ok":"warn",n:47,d:sm.length?tr(55)+": "+sm.join(", "):side.map(b=>BL[b]).join(" ")+" ✓"});
 Q.push({s:!M.up&&!M.dn?"na":M.up&&M.dn?"ok":"warn",n:48,d:"↑ "+M.up+" / ↓ "+M.dn+(M.dl?" · Δ "+M.dl:"")});
 Q.push({s:!any?"na":M.ch?"bad":"ok",n:49,d:String(M.ch)});
 Q.push({s:M.cps==null?"na":M.cps>=6?"ok":"warn",n:50,d:M.cps==null?"—":M.cps.toFixed(1)+" /s"});
 const g={wired:500,wl:125,bt:60}[PF.conn];
 Q.push({s:M.hz==null?"na":M.hz>=g?"ok":"warn",n:51,d:M.hz==null?"—":M.hz+" Hz (≥ "+g+")"});
 Q.push({s:M.j==null?"na":M.j<=40?"ok":"warn",n:52,d:M.j==null?"—":M.j+"%"});
 Q.push({s:M.sp?"ok":"na",n:53,d:M.sp?Math.round(M.sp)+" px/s":"—"});
 if(M.dw.length){const a=avg(M.dw);Q.push({s:a<25?"warn":"ok",n:54,d:Math.round(a)+" ms"})}else Q.push({s:"na",n:54,d:"—"});
 return{K,Q};
}
const sco=a=>{const x=a.filter(i=>i.s!=="na");return x.length?Math.round(x.reduce((t,i)=>t+PT[i.s],0)/x.length*100):null};
const vd=v=>v==null?tr(32):v>=90?tr(37):v>=75?tr(38):v>=50?tr(39):tr(40);
const li=a=>a.map(i=>`<div class="it"><div class="ic ${i.s}" aria-hidden="true">${IC[i.s]}</div><div><b>${tr(i.n)}</b><span>${i.d}</span></div></div>`).join("");
let RP=null;
function report(){
 const{K,Q}=build(),a=sco(K),b=sco(Q),av=[a,b].filter(v=>v!=null),o=av.length?Math.round(avg(av)):null;
 RP={K,Q,a,b,o};
 $("#sc").innerHTML=[[0,a],[1,b],[29,o]].map(([n,v])=>`<div class="card sc1"><div class="ring" style="--v:${v||0}"><i>${v==null?"–":v}</i></div><b>${tr(n)}</b><span>${vd(v)}</span></div>`).join("");
 const bad=K.concat(Q).filter(i=>i.s==="bad"||i.s==="warn");
 $("#sum").innerHTML=o==null?`<b>${tr(32)}</b>`:bad.length?`<b>${tr(30)}</b><ul>`+bad.map(i=>`<li><b>${tr(i.n)}:</b> ${i.d}</li>`).join("")+"</ul>":`<b>${tr(31)}</b>`;
 $("#rk").innerHTML=`<p class="hint">${SZN[PF.size]}</p>`+li(K);
 $("#rm").innerHTML=`<p class="hint">${tr({wired:12,wl:13,bt:14}[PF.conn])} · ${PF.btns>=7?"7+":PF.btns} ${tr(11)}</p>`+li(Q);
 $("#inf").innerHTML=info().map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join("");
}
$("#cp").onclick=async()=>{
 report();const r=RP,f=a=>a.map(i=>"- "+tr(i.n)+": "+i.d).join("\n");
 const t=["InputLab",tr(29)+": "+(r.o??"—"),"",tr(0)+" ("+SZN[PF.size]+") "+(r.a??"—"),f(r.K),"",tr(1)+" ("+PF.conn+", "+PF.btns+") "+(r.b??"—"),f(r.Q),"",...info().map(([k,v])=>k+": "+v)].join("\n");
 let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();ok=document.execCommand("copy");x.remove()}catch(_){}}
 $("#cpm").textContent=ok?tr(34):"";
};
